/* 从 POS 官方菜单（POS_MENU 常量）批量补齐/新增产品：
   - 按产品名称（trim + 不分大小写）去对现有 state.products，对上的话只补分类/编号/所属公司里
     还空着的栏位，绝对不会覆盖已经填好的售价、食材成本、成本算法；
   - 对不上的话（POS 有、这里没有）直接新增一个产品，售价照抄 POS，食材成本留空待填；
   - 不会删除任何现有产品（就算它不在这份 POS 菜单里，比如已经下架的老菜、或手动加的杂项）。
   可以重复点击，不会重复新增或越同步越乱。 */
function syncPosMenu(){
  const norm = s => (s||'').trim().toLowerCase();
  const byName = new Map(state.products.map(p=>[norm(p.name), p]));
  let updated = 0, created = 0;
  mutate(()=>{
    POS_MENU.forEach(m=>{
      const existing = byName.get(norm(m.name));
      if(existing){
        let changed = false;
        if(!existing.category && m.category){ existing.category = m.category; changed = true; }
        if(!existing.code && m.code){ existing.code = m.code; changed = true; }
        if(!existing.company && m.company){ existing.company = m.company; changed = true; }
        if(changed) updated++;
      } else {
        const newId = uid();
        state.products.push({id:newId, name:m.name, price:m.price, costItems:[], costMethod:'unit', category:m.category, code:m.code, company:m.company});
        byName.set(norm(m.name), state.products[state.products.length-1]);
        created++;
      }
    });
  });
  alert(`同步完成：\n・${updated} 个已有产品补上了分类/编号/所属公司\n・${created} 个新增建档（售价照抄 POS 菜单，食材成本还没填，记得去补）\n\n建议接着看看下面列表有没有意思相同、但名字打法跟 POS 不一样变成"重复"的产品（比如手动加的旧名字），有的话把旧的那个食材成本转移过去、再删掉旧的就好。`);
}
/* 把好几个写法不一样、其实是同一样东西的产品合并成一个：
   - fromNames 底下任何一个名字（不分大小写）的历史销售记录，productName 全部改成 toName，
     这样"产品成本"页算销量/毛利的时候才不会因为名字不一样而分开算；
   - 如果 toName 目前还没有对应的产品，就直接把 fromNames 里第一个匹配到的旧产品改名字延用
     （食材成本项不会不见）；如果 toName 已经有产品了，fromNames 匹配到的其他重复产品的食材
     成本项会搬过去，搬完这些重复产品会被删掉。 */
function mergeProductsByName(){
  const fromRaw = document.getElementById('mergeFromList').value.trim();
  const toName = document.getElementById('mergeToTarget').value.trim();
  if(!fromRaw || !toName){ alert('请填写要合并的旧名字，和统一后的名字'); return; }
  const fromNames = fromRaw.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
  if(!fromNames.length){ alert('请填写要合并的旧名字'); return; }
  const norm = s => (s||'').trim().toLowerCase();
  const toNorm = norm(toName);
  const summary = {salesRenamed:0, mergedCostItems:0, removedProducts:0};
  mutate(()=>{
    state.sales.forEach(s=>{
      if(norm(s.productName)!==toNorm && fromNames.some(f=>norm(f)===norm(s.productName))){
        s.productName = toName;
        summary.salesRenamed++;
      }
    });
    let target = state.products.find(p=>norm(p.name)===toNorm);
    let fromProducts = state.products.filter(p=> norm(p.name)!==toNorm && fromNames.some(f=>norm(f)===norm(p.name)) );
    if(!target && fromProducts.length){
      target = fromProducts[0];
      target.name = toName;
      fromProducts = fromProducts.slice(1);
    }
    if(target && fromProducts.length){
      fromProducts.forEach(p=>{
        (p.costItems||[]).forEach(ci=>{ target.costItems = target.costItems || []; target.costItems.push(ci); summary.mergedCostItems++; });
      });
      const removeIds = new Set(fromProducts.map(p=>p.id));
      state.products = state.products.filter(p=>!removeIds.has(p.id));
      summary.removedProducts = fromProducts.length;
    }
  });
  alert(`合并完成：\n・${summary.salesRenamed} 笔销售记录改成了「${toName}」\n・${summary.removedProducts} 个重复的旧产品项目已合并删除${summary.mergedCostItems? `（食材成本项搬了 ${summary.mergedCostItems} 项过去）`:''}`);
}

  const monthSales = salesInScope.filter(s=>monthKey(s.date)===mk);
  const totalRevenue = monthSales.reduce((a,s)=>a+Number(s.amount||0),0);

function onSaleProductChange(){

function updateSalePreview(){

  const price = Number(document.getElementById('salePrice').value)||0;
  document.getElementById('saleAmountPreview').textContent = fmt(qty*price);
}
function submitSale(){
  const typedName = document.getElementById('saleProduct').value.trim();
  const p = state.products.find(x=>x.name.toLowerCase()===typedName.toLowerCase());
  if(!p){ alert('找不到这个产品，请从建议列表里选一个，或先去"成本"页新增这个产品'); return; }
  const qty = Number(document.getElementById('saleQty').value)||0;
  const price = Number(document.getElementById('salePrice').value)||0;
  const date = document.getElementById('saleDate').value || todayStr();
  if(qty<=0){ alert('请输入数量'); return; }
  const amount = qty*price;
  const unitCost = p.costMethod==='total' ? 0 : productUnitCost(p);
  const payMethod = document.getElementById('salePayMethod').value || '其他';
  const company = saleCompany;
  ['saleProduct','salePrice'].forEach(id=>{ const elx=document.getElementById(id); if(elx) elx.value=''; });
  const saleQtyEl = document.getElementById('saleQty'); if(saleQtyEl) saleQtyEl.value = '1';
  const saleDateEl = document.getElementById('saleDate'); if(saleDateEl) saleDateEl.value = todayStr();
  mutate(()=>{
    const sid = uid();
    state.sales.push({id:sid, date, productId:p.id, productName:p.name, qty, price, amount, cost: unitCost*qty, payMethod, company});
    // 销售记录不再自动生成收支流水——收支由用户自己手动记录，这里只做产品利润统计用
  });
  renderSales();
}
function deleteSale(id){
  if(!confirm('确定删除这笔销售记录？（关联的现金流水也会删除）')) return;
  mutate(()=>{
    state.sales = state.sales.filter(s=>s.id!==id);
    state.cashflow = state.cashflow.filter(c=>!(c.auto && c._saleId===id));
  });
}
/* 删掉某一整批 CSV 导入的销售记录（比如发现导入重复了、或那批文件本身填错了）。
   只删这批带 importBatch 标记的销售记录，其他手动记的、别批导入的都不受影响。
   这批当时自动新增的产品不会被删除（怕别的销售记录也在用），只是不会再被用到而已。 */
function deleteImportBatch(batchId){
  const batch = (state.importBatches||[]).find(b=>b.id===batchId);
  const type = batch ? (batch.type||'sales') : 'sales';
  const n = type==='purchase' ? state.purchases.filter(p=>p.importBatch===batchId).length
    : type==='payment' ? state.payments.filter(p=>p.importBatch===batchId).length
    : state.sales.filter(s=>s.importBatch===batchId).length;
  const unit = type==='purchase' ? '张采购单' : type==='payment' ? '笔付款记录' : '笔销售记录';
  const noun = type==='purchase' ? '采购单' : type==='payment' ? '付款记录' : '销售记录';
  if(!n){ alert(`这批导入已经没有对应的${noun}了（可能已经被删过）`); mutate(()=>{ state.importBatches=(state.importBatches||[]).filter(b=>b.id!==batchId); }); return; }
  if(!confirm(`确定删除这批导入的 ${n} ${unit}吗？（${batch?batch.fileName:''}）此操作无法撤销。`)) return;
  mutate(()=>{
    if(type==='purchase'){
      const removedIds = state.purchases.filter(p=>p.importBatch===batchId).map(p=>p.id);
      state.purchases = state.purchases.filter(p=>p.importBatch!==batchId);
      removedIds.forEach(rid=>removeAutoMarinadeFor(rid));
    } else if(type==='payment'){
      const removedIds = new Set(state.payments.filter(p=>p.importBatch===batchId).map(p=>p.id));
      state.payments = state.payments.filter(p=>p.importBatch!==batchId);
      state.cashflow = state.cashflow.filter(c=>!(c.auto && c._paymentId && removedIds.has(c._paymentId)));
    } else {
      state.sales = state.sales.filter(s=>s.importBatch!==batchId);
    }
    state.importBatches = (state.importBatches||[]).filter(b=>b.id!==batchId);
  });
  alert(`已删除这批的 ${n} ${unit}`);
}

/* ---------------- 批量导入销售报告（CSV）---------------- */
function downloadSalesImportTemplate(){
  const header = ['日期','产品','数量','单价(选填，不填就用产品目前的售价)','收款方式(选填)','公司(选填)'];
  const example = ['2026-08-01','招牌炒河粉','2','15.90','Cash', COMPANIES[0]];
  downloadCSV('销售报告模板.csv', header, [example]);
}
/* 简单的 CSV 解析（支持带引号的字段，内含逗号/换行/转义引号），不依赖外部库 */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1); // 去掉 BOM
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* 忽略，交给 \n 处理换行 */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}
/* 一次选多个 CSV 文件一起读，全部读完再一起处理（批量导入销售/采购/付款都共用这个）。
   任何一个文件读取失败都会整个中断，避免读到一半、只导入一部分文件的数据。 */
function readFilesAsText(fileList){
  return Promise.all(Array.from(fileList).map(file=>new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>resolve({name:file.name, text:String(e.target.result)});
    reader.onerror = ()=>reject(new Error('读取文件失败：'+file.name));
    reader.readAsText(file, 'UTF-8');
  })));
}
/* 尽量把常见几种日期写法都转成系统统一用的 YYYY-MM-DD */
function normalizeDateStr(str){
  const s = (str||'').trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){
    const [y,m,d] = s.split('-');
    return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); // DD/MM/YYYY 或 DD-MM-YYYY
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}
function importSalesReport(fileInput){
  const files = fileInput.files;
  if(!files || !files.length) return;
  readFilesAsText(files).then(fileTexts=>{
    try{
      const allRows = []; // {r, tag, lineNo}
      fileTexts.forEach(ft=>{
        const rows = parseCSV(ft.text);
        if(rows.length<2) return; // 这个文件没有数据行，跳过（多文件时不算致命错误）
        rows.slice(1).forEach((r,idx)=>allRows.push({r, tag:ft.name, lineNo:idx+2}));
      });
      if(allRows.length===0){ alert('这些文件里都没有找到数据行，请确认是不是用模板格式填的'); fileInput.value=''; return; }
      const toAdd = [];
      const errors = [];
      const newProducts = []; // 本次导入需要自动新增的产品（去重）
      const newProductByKey = {}; // key: 产品名小写 -> 待新增的产品对象
      const multi = fileTexts.length>1;
      allRows.forEach(({r, tag, lineNo})=>{
        const loc = multi ? `${tag} 第${lineNo}行` : `第${lineNo}行`;
        if(!r.some(v=>(v||'').trim()!=='')) return; // 空行跳过
        const date = normalizeDateStr(r[0]);
        const productName = (r[1]||'').trim();
        const qty = Number(r[2]);
        const priceRaw = (r[3]||'').trim();
        const payMethodRaw = (r[4]||'').trim();
        const companyRaw = (r[5]||'').trim();
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ errors.push(`${loc}：日期"${r[0]||''}"看不懂，请用 2026-08-01 这种格式`); return; }
        if(!productName){ errors.push(`${loc}：缺少产品名称`); return; }
        let product = state.products.find(p=>p.name.toLowerCase()===productName.toLowerCase());
        if(!product){
          // 找不到就自动建一个新产品（无成本项，售价用这笔的单价，之后要自己去"成本"页补充食材成本）
          const key = productName.toLowerCase();
          product = newProductByKey[key];
          if(!product){
            product = {id:uid(), name:productName, price:0, costItems:[], costMethod:'unit', _isNew:true};
            newProductByKey[key] = product;
            newProducts.push(product);
          }
        }
        if(!qty || qty<=0 || isNaN(qty)){ errors.push(`${loc}：数量不对`); return; }
        const price = priceRaw!=='' ? Number(priceRaw) : Number(product.price||0);
        if(isNaN(price)){ errors.push(`${loc}：单价不对`); return; }
        if(product._isNew && !product._priceSet && price>0){ product.price = price; product._priceSet = true; }
        const payMethod = payMethodRaw || '其他';
        let company = '';
        if(companyRaw){
          if(COMPANIES.includes(companyRaw)) company = companyRaw;
          else errors.push(`${loc}：公司"${companyRaw}"不认得（可选：${COMPANIES.join('、')}），这行会先不分公司导入`);
        }
        toAdd.push({date, product, qty, price, payMethod, company});
      });
      if(toAdd.length===0){ alert('没有成功解析到任何一笔销售记录：\n\n' + errors.join('\n')); fileInput.value=''; return; }
      let msg = multi ? `准备从 ${fileTexts.length} 个文件里导入 ${toAdd.length} 笔销售记录` : `准备导入 ${toAdd.length} 笔销售记录`;
      if(newProducts.length) msg += `\n\n其中 ${newProducts.length} 个产品在"成本"页找不到，会自动新增（暂无成本项，售价用导入数据里的单价，之后请自己去"成本"页补充食材成本）：\n` + newProducts.map(p=>`${p.name}（¥${fmt(p.price)}）`).join('、');
      if(errors.length) msg += `\n\n另外有 ${errors.length} 行有问题：\n\n` + errors.join('\n') + '\n\n这些行不会被导入。';
      msg += '\n\n确定继续导入吗？';
      if(!confirm(msg)){ fileInput.value=''; return; }
      const batchId = uid();
      const importedFileName = multi ? `${fileTexts.length}个文件（${fileTexts.map(f=>f.name).join('、')}）` : (fileTexts[0] ? fileTexts[0].name : 'CSV导入');
      mutate(()=>{
        if(!state.importBatches) state.importBatches = [];
        newProducts.forEach(np=>{
          state.products.push({id:np.id, name:np.name, price:np.price, costItems:[], costMethod:'unit'});
        });
        let batchAmount = 0;
        const dates = [];
        toAdd.forEach(item=>{
          const p = item.product;
          const amount = item.qty * item.price;
          const unitCost = p.costMethod==='total' ? 0 : productUnitCost(p);
          const sid = uid();
          state.sales.push({id:sid, date:item.date, productId:p.id, productName:p.name, qty:item.qty, price:item.price, amount, cost: unitCost*item.qty, payMethod:item.payMethod, company:item.company, importBatch:batchId});
          // 销售记录不再自动生成收支流水——收支由用户自己手动记录，这里只做产品利润统计用
          batchAmount += amount;
          dates.push(item.date);
        });
        const minDate = dates.length? dates.reduce((a,b)=>a<b?a:b) : todayStr();
        const maxDate = dates.length? dates.reduce((a,b)=>a>b?a:b) : todayStr();
        state.importBatches.push({id:batchId, type:'sales', fileName:importedFileName, importedAt:Date.now(), count:toAdd.length, amount:batchAmount, dateRange: minDate===maxDate? minDate : `${minDate} ~ ${maxDate}`});
      });
      alert(`已成功导入 ${toAdd.length} 笔销售记录${newProducts.length? `，自动新增了 ${newProducts.length} 个产品`:''}${errors.length? `，${errors.length} 行被跳过`:''}\n\n如果之后发现这批导入有问题，可以去"销售"页的"最近批量导入"里把这整批一次性删掉。`);
    }catch(err){
      alert('文件解析失败，请确认是不是用系统模板格式的CSV文件。\n' + err.message);
    }
    fileInput.value = '';
  }).catch(err=>{
    alert('文件读取失败：' + err.message);
    fileInput.value = '';
  });
}

/* 格式跟"采购"页导出的采购记录 CSV 一样（日期,公司,供应商,Invoice号,品名,类别,数量,单位,单价,总价,关联产品），

function importPurchasesReport(fileInput){
  const files = fileInput.files;
  if(!files || !files.length) return;

      });
      if(allRows.length===0){ alert('这些文件里都没有找到数据行，请确认是不是用模板格式填的'); fileInput.value=''; return; }
      const multi = fileTexts.length>1;
      const errors = [];
      const groups = {}; // key -> {date, company, supplierName, invoiceNumber, items:[]}
      const groupOrder = [];
      const newProducts = []; // 本次导入需要自动新增的产品（"成本"页找不到的关联产品，去重）
      const newProductByKey = {}; // key: 产品名小写 -> 待新增的产品对象
      allRows.forEach(({r, tag, lineNo})=>{
        const loc = multi ? `${tag} 第${lineNo}行` : `第${lineNo}行`;
        if(!r.some(v=>(v||'').trim()!=='')) return;
        const date = normalizeDateStr(r[0]);
        const companyRaw = (r[1]||'').trim();
        const supplierNameRaw = (r[2]||'').trim();
        const invoiceNumber = (r[3]||'').trim();
        const itemName = (r[4]||'').trim();
        let category = (r[5]||'').trim();
        const qty = Number(r[6]);
        const unit = (r[7]||'').trim();
        const unitPriceRaw = (r[8]||'').trim();
        const totalRaw = (r[9]||'').trim();
        const linkedRaw = (r[10]||'').trim();
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ errors.push(`${loc}：日期"${r[0]||''}"看不懂，请用 2026-08-01 这种格式`); return; }
        if(!supplierNameRaw){ errors.push(`${loc}：缺少供应商名称`); return; }
        if(!itemName){ errors.push(`${loc}：缺少品名`); return; }
        if(!qty || qty<=0 || isNaN(qty)){ errors.push(`${loc}：数量不对`); return; }
        if(!category || !PURCHASE_CATEGORIES.includes(category)){
          if(category) errors.push(`${loc}：类别"${category}"不认得，先当"食材"处理`);
          category = '食材';
        }
        let company = '';
        if(companyRaw){
          if(COMPANIES.includes(companyRaw)) company = companyRaw;
          else errors.push(`${loc}：公司"${companyRaw}"不认得（可选：${COMPANIES.join('、')}），这行会先不分公司导入`);
        }
        let unitPrice = unitPriceRaw!=='' ? Number(unitPriceRaw) : NaN;
        let totalCost = totalRaw!=='' ? Number(totalRaw) : NaN;
        if(isNaN(totalCost) && !isNaN(unitPrice)) totalCost = Math.round(qty*unitPrice*100)/100;
        if(isNaN(unitPrice) && !isNaN(totalCost) && qty) unitPrice = Math.round((totalCost/qty)*100)/100;
        if(isNaN(totalCost)){ errors.push(`${loc}："单价"和"总价"至少要填一个`); return; }
        /* 分隔符不能用"/"——产品名本身可能带"(小/SMALL)"这种规格后缀，用"/"切会把一个产品名切成两半 */
        const linkedNames = linkedRaw ? linkedRaw.split(/[、,;]/).map(s=>s.trim()).filter(Boolean) : [];
        const productIds = [];
        linkedNames.forEach(nm=>{
          let p = state.products.find(x=>x.name.toLowerCase()===nm.toLowerCase());
          if(!p){
            // "成本"页找不到就自动新增一个（无成本项，售价0，之后自己去"成本"页补），不再跳过这个关联
            const key = nm.toLowerCase();
            p = newProductByKey[key];
            if(!p){
              p = {id:uid(), name:nm, price:0, costItems:[], costMethod:'unit', _isNew:true};
              newProductByKey[key] = p;
              newProducts.push(p);
            }
          }
          productIds.push(p.id);
        });
        const key = [supplierNameRaw.toLowerCase(), invoiceNumber.toLowerCase(), date].join('|');
        if(!groups[key]){
          groups[key] = {date, supplierNameRaw, invoiceNumber, items:[]};
          groupOrder.push(key);
        }
        groups[key].items.push({id:uid(), name:itemName, category, qty, unit, unitPrice: isNaN(unitPrice)?0:unitPrice, totalCost, productIds, company});
      });
      const purchaseGroups = groupOrder.map(k=>groups[k]).filter(g=>g.items.length);
      if(purchaseGroups.length===0){ alert('没有成功解析到任何一笔采购：\n\n' + errors.join('\n')); fileInput.value=''; return; }
      const totalItems = purchaseGroups.reduce((a,g)=>a+g.items.length,0);
      let msg = multi ? `准备从 ${fileTexts.length} 个文件里导入 ${purchaseGroups.length} 张采购单（共 ${totalItems} 项品项）` : `准备导入 ${purchaseGroups.length} 张采购单（共 ${totalItems} 项品项）`;
      if(newProducts.length) msg += `\n\n其中 ${newProducts.length} 个关联产品在"成本"页找不到，会自动新增（暂无成本项/售价0，之后请自己去"成本"页补充）：\n` + newProducts.map(p=>p.name).join('、');
      if(errors.length) msg += `\n\n另外有 ${errors.length} 处问题：\n\n` + errors.join('\n');
      msg += '\n\n确定继续导入吗？';
      if(!confirm(msg)){ fileInput.value=''; return; }
      const batchId = uid();
      const importedFileName = multi ? `${fileTexts.length}个文件（${fileTexts.map(f=>f.name).join('、')}）` : (fileTexts[0] ? fileTexts[0].name : 'CSV导入');
      mutate(()=>{
        if(!state.importBatches) state.importBatches = [];
        newProducts.forEach(np=>{
          state.products.push({id:np.id, name:np.name, price:np.price, costItems:[], costMethod:'unit'});
        });
        let batchAmount = 0;
        const dates = [];
        const pushedPurchases = [];
        purchaseGroups.forEach(g=>{
          const supplierId = findOrCreateSupplierId(g.supplierNameRaw);
          const totalAmount = g.items.reduce((a,i)=>a+Number(i.totalCost||0),0);
          const itemCompanies = new Set(g.items.map(i=>i.company).filter(Boolean));
          const groupCompany = itemCompanies.size===1 ? Array.from(itemCompanies)[0] : '';
          const newPur = {id:uid(), date:g.date, supplierId, items:g.items, totalAmount, invoiceNumber:g.invoiceNumber, company:groupCompany, importBatch:batchId};
          state.purchases.push(newPur);
          pushedPurchases.push(newPur);
          g.items.forEach(i=>learnIngredientLink(i.name, i.productIds, {unit:i.unit, unitPrice:i.unitPrice}));
          batchAmount += totalAmount;
          dates.push(g.date);
        });
        applyAutoMarinadeRecipes(pushedPurchases);
        const minDate = dates.length? dates.reduce((a,b)=>a<b?a:b) : todayStr();
        const maxDate = dates.length? dates.reduce((a,b)=>a>b?a:b) : todayStr();
        state.importBatches.push({id:batchId, type:'purchase', fileName:importedFileName, importedAt:Date.now(), count:purchaseGroups.length, amount:batchAmount, dateRange: minDate===maxDate? minDate : `${minDate} ~ ${maxDate}`});
      });
      alert(`已成功导入 ${purchaseGroups.length} 张采购单（共 ${totalItems} 项）${errors.length? `，${errors.length} 处被跳过或先不分类`:''}\n\n如果之后发现这批导入有问题，可以去"采购"页的"最近批量导入"里把这整批一次性删掉。`);
    }catch(err){
      alert('文件解析失败，请确认是不是用系统模板格式的CSV文件。\n' + err.message);
    }
    fileInput.value = '';
  }).catch(err=>{
    alert('文件读取失败：' + err.message);
    fileInput.value = '';
  });
}

let cfCategory = EXPENSE_CATEGORIES[0];
let cfPayMethod = PAY_METHODS[0];
let cfCompany = COMPANIES[0];
let cfHistoryFilterCompany = '';

function renderCash(){

  const bal = cashBalance();

        ${CF_TYPES.map(t=>`<button type="button" class="btn-toggle ${t.v} ${cfType===t.v?'active':''}" data-val="${t.v}" onclick="setCfType('${t.v}')">${t.label}</button>`).join('')}
      </div>

      <button class="btn-main" onclick="submitCashflow()">保存记录</button>
    </div>

    <div class="card">
      <h3>现金结余</h3>
      <table>
        <tr><td>期初余额</td><td class="num">${fmt(state.initialCash)}</td></tr>
        <tr><td>累计收入</td><td class="num">${fmt(state.cashflow.filter(c=>c.type==='in').reduce((a,c)=>a+Number(c.amount||0),0))}</td></tr>
        <tr><td>累计支出</td><td class="num">${fmt(state.cashflow.filter(c=>c.type==='out').reduce((a,c)=>a+Number(c.amount||0),0))}</td></tr>
        <tr><td><b>当前结余</b></td><td class="num"><b>${fmt(bal)}</b></td></tr>
      </table>
      <hr class="receipt-divider">
      <table>
        <tr><td>现金余额</td><td class="num">${fmt(now.cash)}</td></tr>
        <tr><td>银行余额</td><td class="num">${fmt(now.bank)}</td></tr>
        <tr><td class="muted">上月现金余额 <span class="muted" style="font-size:11px">（截至 ${lastMonthEnd}）</span></td><td class="num">${fmt(lastMonth.cash)}</td></tr>
      </table>
    </div>

    <div class="card">
      <h3>收支流水</h3>
      <label>按公司筛选</label>
      <div class="btn-group" style="margin-bottom:10px">
        <button type="button" class="btn-toggle ${!cfHistoryFilterCompany?'active':''}" onclick="setCfHistoryFilterCompany('')">全部</button>
        ${COMPANIES.map(c=>`<button type="button" class="btn-toggle ${cfHistoryFilterCompany===c?'active':''}" onclick="setCfHistoryFilterCompany('${c}')">${c}</button>`).join('')}
      </div>
      ${cashflowInScope.length? `<table>
        <tr><th>日期</th><th>类别</th><th class="num">金额</th><th></th></tr>
        ${(()=>{
          // 同一次「记一笔收支」如果同时填了 Cash+TNG+FoodPanda，会拆成好几笔流水（用 groupId 串起来）。
          // 老数据没有 groupId（这个功能是后来才加的），退而求其次：同一天、同一间公司、同样的收入、
          // 备注也一样的话，也当成同一组合并显示（纯粹显示层面的智能合并，不改数据本身）。
          // 只对「收入」且不是系统自动生成（如供应商付款）的记录做这个退而求其次的判断，
          // 支出本来就是一笔一个金额，不会有这种「同一次填好几个」的情况，不需要合并。
          const groupsMap = new Map();
          const order = [];
          cashflowInScope.forEach(c=>{
            const key = c.groupId || (c.type==='in' && !c.auto
              ? `heur|${c.date}|${cashflowCompany(c)}|${(c.note||'').trim()}`
              : c.id);
            if(!groupsMap.has(key)){ groupsMap.set(key, []); order.push(key); }
            groupsMap.get(key).push(c);
          });
          const groups = order.map(key=>groupsMap.get(key));
          return groups.slice().reverse().map(group=>{
            const first = group[0];
            const total = group.reduce((a,g)=>a+Number(g.amount||0),0);
            const ids = group.map(g=>g.id).join(',');
            const companyLine = cashflowCompany(first)?`<div class="muted" style="font-size:11px">${cashflowCompany(first)}</div>`:'';
            const noteLine = first.note?`<div class="muted" style="font-size:11px">${first.note}</div>`:'';
            const categoryCell = group.length>1
              ? `${group.map(g=>`<div class="muted" style="font-size:11px">${g.category} ${fmtPlain(g.amount)}</div>`).join('')}${companyLine}${noteLine}`
              : `${first.category}${first.payMethod?` <span class="muted" style="font-size:11px">· ${first.payMethod}</span>`:''}${companyLine}${noteLine}`;
            return `
          <tr>
            <td class="muted">${first.date}</td>
            <td>${categoryCell}</td>
            <td class="num" style="color:${first.type==='in'?'var(--green)':'var(--rust)'}">${first.type==='in'?'+':'-'}${fmtPlain(total)}</td>
            <td>${first.auto? '' : `<button class="btn-danger-text" onclick="deleteCashflow('${ids}')">删</button>`}</td>
          </tr>`;
          }).join('');
        })()}
      </table>` : `<div class="empty">${cfHistoryFilterCompany? '这间公司还没有相关流水' : '还没有收支记录'}</div>`}
    </div>
  `;
  renderCfBodyWrap(draft);
}

/* 收支表单主体：收入可以同时填 Cash / TNG / FoodPanda 几个金额，一次保存会拆成对应几笔流水；
   支出维持原本的"分类 + 付款方式 + 单一金额"。 */
function renderCfBodyWrap(draft){
  draft = draft || {};
  const wrap = document.getElementById('cfBodyWrap');
  if(!wrap) return;
  if(cfType==='in'){
    wrap.innerHTML = `
      <label>收入金额（可同时填多个，比如 Cash + TNG 一起入账）</label>
      <div class="grid3">
        ${INCOME_CATEGORIES.map(c=>`<div><label style="margin-top:0">${c}</label><input type="number" step="0.01" id="cfIncome_${c}" placeholder="0.00" value="${draft['cfIncome_'+c]||''}"></div>`).join('')}
      </div>
    `;
  }else{
    wrap.innerHTML = `
      <label>分类</label>
      <div class="btn-group" id="cfCategoryGroup"></div>
      <div id="cfPayMethodWrap"></div>
      <label>金额</label><input type="number" step="0.01" id="cfAmount" value="${draft.cfAmount||''}">
    `;
    renderCfCategoryGroup();
    renderCfPayMethodGroup();
  }
}
function renderCfCategoryGroup(){
  const custom = state.customExpenseCategories || [];
  const cats = EXPENSE_CATEGORIES.concat(custom);
  if(!cats.includes(cfCategory)) cfCategory = cats[0];
  const wrap = document.getElementById('cfCategoryGroup');
  if(!wrap) return;
  wrap.innerHTML = cats.map(c=>{
    const isCustom = custom.includes(c);
    return `<button type="button" class="btn-toggle ${cfCategory===c?'active':''}" data-val="${c}" onclick="setCfCategory('${c}')">${c}${isCustom?` <span onclick="event.stopPropagation(); removeCfCategory('${c}')" style="opacity:.65; margin-left:2px;">×</span>`:''}</button>`;
  }).join('') + `<button type="button" class="btn-toggle" style="border-style:dashed;" onclick="addCfCategory()">+ 自定义分类</button>`;
}
function addCfCategory(){
  const name = prompt('输入新的支出分类名称：');
  if(name===null) return;
  const trimmed = name.trim();
  if(!trimmed){ alert('分类名称不能为空'); return; }
  const custom = state.customExpenseCategories || [];
  if(EXPENSE_CATEGORIES.includes(trimmed) || custom.includes(trimmed)){
    cfCategory = trimmed;
    renderCfCategoryGroup();
    return;
  }
  mutate(()=>{
    if(!state.customExpenseCategories) state.customExpenseCategories = [];
    state.customExpenseCategories.push(trimmed);
  });
  cfType = 'out';
  cfCategory = trimmed;
  renderCash();
}
function removeCfCategory(name){
  if(!confirm(`确定删除自定义分类「${name}」吗？已经用这个分类记过的流水不会被删除。`)) return;
  mutate(()=>{
    state.customExpenseCategories = (state.customExpenseCategories||[]).filter(c=>c!==name);
  });
  cfCategory = EXPENSE_CATEGORIES[0];
  renderCash();
}
function renderCfPayMethodGroup(){
  const wrap = document.getElementById('cfPayMethodWrap');
  if(!wrap) return;
  wrap.innerHTML = `<label>付款方式</label><div class="btn-group" id="cfPayMethodGroup">${PAY_METHODS.map(m=>`<button type="button" class="btn-toggle ${cfPayMethod===m?'active':''}" data-val="${m}" onclick="setCfPayMethod('${m}')">${m}</button>`).join('')}</div>`;

function setCfType(val){
  cfType = val;
  document.querySelectorAll('#cfTypeGroup .btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.val===val));
  renderCfBodyWrap();
}
function setCfCategory(val){
  cfCategory = val;
  document.querySelectorAll('#cfCategoryGroup .btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.val===val));
}
function setCfPayMethod(val){
  cfPayMethod = val;
  document.querySelectorAll('#cfPayMethodGroup .btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.val===val));
}
function submitCashflow(){
  const type = cfType;
  const company = cfCompany;
  const note = document.getElementById('cfNote').value.trim();
  const date = document.getElementById('cfDate').value || todayStr();
  if(!company){ alert('请选择公司'); return; }

  if(type==='in'){
    // 收入可以同时填 Cash / TNG / FoodPanda 几个金额，一次保存拆成对应几笔流水（分类各自记账），
    // 但同一次填的这几笔要给一个共同的 groupId，方便流水列表把它们合并显示成一行「总计」，明细收在里面。
    const entries = INCOME_CATEGORIES.map(c=>{
      const elx = document.getElementById('cfIncome_'+c);
      return {category:c, amount: Number(elx ? elx.value : 0)||0};
    }).filter(e=>e.amount>0);
    if(entries.length===0){ alert('请至少填写一个收入金额'); return; }
    document.getElementById('cfNote').value = '';
    const cfDateEl = document.getElementById('cfDate'); if(cfDateEl) cfDateEl.value = todayStr();
    const groupId = entries.length>1 ? uid() : null;
    mutate(()=>{
      entries.forEach(e=>{
        state.cashflow.push({id:uid(), date, type:'in', category:e.category, amount:e.amount, company, note, auto:false, groupId});
      });
    });
  }else{
    const category = cfCategory;
    const payMethod = cfPayMethod;
    const amount = Number(document.getElementById('cfAmount').value)||0;
    if(amount<=0){ alert('请输入金额'); return; }
    document.getElementById('cfNote').value = '';
    const cfDateEl = document.getElementById('cfDate'); if(cfDateEl) cfDateEl.value = todayStr();
    mutate(()=>{ state.cashflow.push({id:uid(), date, type:'out', category, amount, payMethod, company, note, auto:false}); });
  }

  cfPayMethod = PAY_METHODS[0];
  cfType = 'out';
  cfCategory = EXPENSE_CATEGORIES[0];
  renderCash();
}
function deleteCashflow(idOrIds){
  if(!confirm('确定删除这条流水？')) return;
  const ids = String(idOrIds).split(',');
  mutate(()=>{ state.cashflow = state.cashflow.filter(c=>!ids.includes(c.id)); });
}

function submitChangePassword(){
  const msgEl = document.getElementById('settingsPwMsg');
  const user = firebase.auth().currentUser;
  if(!user){ msgEl.style.color = 'var(--rust)'; msgEl.textContent = '目前没有登录'; return; }
  const curPw = document.getElementById('settingsCurrentPw').value;
  const newPw = document.getElementById('settingsNewPw').value;
  const newPw2 = document.getElementById('settingsNewPw2').value;
  if(!curPw || !newPw){ msgEl.style.color = 'var(--rust)'; msgEl.textContent = '请把目前密码和新密码都填好'; return; }
  if(newPw.length<6){ msgEl.style.color = 'var(--rust)'; msgEl.textContent = '新密码至少要6个字'; return; }
  if(newPw!==newPw2){ msgEl.style.color = 'var(--rust)'; msgEl.textContent = '两次输入的新密码不一样'; return; }
  msgEl.style.color = 'var(--muted)';
  msgEl.textContent = '处理中…';
  const cred = firebase.auth.EmailAuthProvider.credential(user.email, curPw);
  user.reauthenticateWithCredential(cred).then(()=>{
    return user.updatePassword(newPw);
  }).then(()=>{
    msgEl.style.color = 'var(--green)';
    msgEl.textContent = '密码已更新';
    ['settingsCurrentPw','settingsNewPw','settingsNewPw2'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  }).catch(err=>{
    msgEl.style.color = 'var(--rust)';
    msgEl.textContent = err.code==='auth/wrong-password' ? '目前的密码不对' : ('更新失败：' + err.message);
  });
}

/* ================= 库存 Tab ================= */
/* 库存不是单独记账的，是从"采购"页历史记录自动汇总出来的（按品名归类、累加数量），
   再加上这里手动记的"出入库调整"（损耗、盘点校正、非采购来源的入库等）。
   目前库存 = 历史采购总数量 + 所有调整（入库为正、出库/损耗为负）。
   这只是个大概的参考库存，因为系统目前不会在"销售"时自动扣库存，
   实际用量要靠自己记出入库来维持准确。 */
let invFilterCompany = '';
let invSearchText = '';
let stockAdjCompany = '';
let stockAdjType = 'out';

function computeInventoryRows(){
  const map = {};
  state.purchases.forEach(p=>{
    (p.items||[]).forEach(i=>{
      if(invFilterCompany && effCompany(i,p)!==invFilterCompany) return;
      if(!i.name) return;
      const key = i.name.trim().toLowerCase();
      if(!map[key]) map[key] = {name:i.name.trim(), unit:i.unit||'', purchased:0, adjusted:0};
      map[key].purchased += Number(i.qty||0);
      if(!map[key].unit && i.unit) map[key].unit = i.unit;
    });
  });
  (state.stockAdjustments||[]).forEach(a=>{
    if(invFilterCompany && a.company && a.company!==invFilterCompany) return;
    const key = (a.itemName||'').trim().toLowerCase();
    if(!key) return;
    if(!map[key]) map[key] = {name:a.itemName.trim(), unit:'', purchased:0, adjusted:0};
    map[key].adjusted += Number(a.qty||0);
  });
  let rows = Object.values(map).map(r=>Object.assign({}, r, {stock: r.purchased + r.adjusted}));
  if(invSearchText.trim()){
    const q = invSearchText.trim().toLowerCase();
    rows = rows.filter(r=>r.name.toLowerCase().includes(q));
  }
  rows.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  return rows;
}
function renderInventory(){
  const el = document.getElementById('tab-inventory');
  if(!el) return;
  const draft = captureFormValues(['invSearchInput','stockAdjItemText','stockAdjQty','stockAdjDate','stockAdjNote']);
  const rows = computeInventoryRows();
  el.innerHTML = `
    <div class="card">
      <h3>库存总览 <span class="n">共 ${rows.length} 项</span></h3>
      <div class="muted" style="font-size:11.5px; margin-bottom:8px;">库存 = 历史所有采购单里的数量总和 + 下面手动记的出入库调整。系统不会在"销售"时自动扣库存，只是个大概参考，准不准要靠自己记出入库来维护。</div>
      <label>按公司筛选</label>
      <div class="btn-group" style="margin-bottom:10px">
        <button type="button" class="btn-toggle ${!invFilterCompany?'active':''}" onclick="setInvFilterCompany('')">全部</button>
        ${COMPANIES.map(c=>`<button type="button" class="btn-toggle ${invFilterCompany===c?'active':''}" onclick="setInvFilterCompany('${c}')">${c}</button>`).join('')}
      </div>
      <input id="invSearchInput" placeholder="搜索品名…" value="${draft.invSearchInput!==undefined?draft.invSearchInput:invSearchText}" oninput="setInvSearchText(this.value)" style="margin-bottom:10px;">
      ${rows.length? `<table>
        <tr><th>品名</th><th>单位</th><th class="num">已采购</th><th class="num">手动调整</th><th class="num">目前库存</th><th></th></tr>
        ${rows.map(r=>`
          <tr>
            <td>${r.name}</td>
            <td class="muted">${r.unit||'-'}</td>
            <td class="num">${fmtPlain(r.purchased)}</td>
            <td class="num" style="${r.adjusted<0?'color:var(--rust)':(r.adjusted>0?'color:var(--green)':'')}">${r.adjusted>0?'+':''}${fmtPlain(r.adjusted)}</td>
            <td class="num" style="font-weight:600">${fmtPlain(r.stock)}</td>
            <td><button class="btn-ghost btn-small" onclick="quickFillStockAdj('${r.name.replace(/'/g,"\\'")}')">出入库</button></td>
          </tr>`).join('')}
      </table>` : `<div class="empty">${invSearchText||invFilterCompany?'没有符合条件的品项':'还没有库存数据，先去"采购"页记一些采购单'}</div>`}
    </div>

    <div class="card">
      <h3>记一笔出入库调整</h3>
      <div class="muted" style="font-size:11.5px; margin-bottom:8px;">用来记损耗、盘点校正、或不是从"采购"页来的入库。</div>
      <label>公司（选填）</label>
      <div class="btn-group" id="stockAdjCompanyGroup" style="margin-bottom:10px">
        <button type="button" class="btn-toggle ${!stockAdjCompany?'active':''}" data-val="" onclick="setStockAdjCompany('')">不指定</button>
        ${COMPANIES.map(c=>`<button type="button" class="btn-toggle ${stockAdjCompany===c?'active':''}" data-val="${c}" onclick="setStockAdjCompany('${c}')">${c}</button>`).join('')}
      </div>
      <label>品名</label>
      <input list="invItemNames" id="stockAdjItemText" placeholder="输入或选择品名" autocomplete="off" value="${draft.stockAdjItemText||''}">
      <datalist id="invItemNames">${rows.map(r=>`<option value="${r.name}">`).join('')}</datalist>
      <div class="grid2" style="margin-top:10px">
        <div><label>类型</label>
          <div class="btn-group" id="stockAdjTypeGroup">
            <button type="button" class="btn-toggle ${stockAdjType==='out'?'active':''}" data-val="out" onclick="setStockAdjType('out')">出库/损耗</button>
            <button type="button" class="btn-toggle ${stockAdjType==='in'?'active':''}" data-val="in" onclick="setStockAdjType('in')">入库/盘盈</button>
          </div>
        </div>
        <div><label>数量</label><input type="number" step="0.01" id="stockAdjQty" placeholder="正数就好" value="${draft.stockAdjQty||''}"></div>
      </div>
      <label>日期</label><input type="date" id="stockAdjDate" value="${draft.stockAdjDate||todayStr()}" onchange="this.blur()">
      <label>备注（选填）</label><input id="stockAdjNote" placeholder="例：打翻了、盘点校正" value="${draft.stockAdjNote||''}">
      <button class="btn-main" onclick="submitStockAdjustment()">+ 记录调整</button>
    </div>

    <div class="card">
      <h3>出入库调整记录</h3>
      ${(state.stockAdjustments&&state.stockAdjustments.length)? `<table>
        <tr><th>日期</th><th>品名</th><th class="num">数量</th><th>备注</th><th></th></tr>
        ${state.stockAdjustments.slice().reverse().map(a=>`
          <tr>
            <td class="muted">${a.date}</td>
            <td>${a.itemName}${a.company?`<div class="muted" style="font-size:11px">${a.company}</div>`:''}</td>
            <td class="num" style="${a.qty<0?'color:var(--rust)':'color:var(--green)'}">${a.qty>0?'+':''}${fmtPlain(a.qty)}</td>
            <td class="muted" style="font-size:12px">${a.note||''}</td>
            <td><button class="btn-danger-text" onclick="deleteStockAdjustment('${a.id}')">删</button></td>
          </tr>`).join('')}
      </table>` : `<div class="empty">还没有出入库调整记录</div>`}
    </div>
  `;
}
function setInvFilterCompany(val){ invFilterCompany = val; renderInventory(); }
function setInvSearchText(val){ invSearchText = val; renderInventory(); }
function setStockAdjCompany(val){
  stockAdjCompany = val;
  document.querySelectorAll('#stockAdjCompanyGroup .btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.val===val));
}
function setStockAdjType(val){
  stockAdjType = val;
  document.querySelectorAll('#stockAdjTypeGroup .btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.val===val));
}
function quickFillStockAdj(name){
  const elx = document.getElementById('stockAdjItemText');
  if(!elx) return;
  elx.value = name;
  elx.scrollIntoView({behavior:'smooth', block:'center'});
  elx.focus();
}
function submitStockAdjustment(){
  const itemName = (document.getElementById('stockAdjItemText').value||'').trim();
  const date = document.getElementById('stockAdjDate').value || todayStr();
  const qtyRaw = Number(document.getElementById('stockAdjQty').value);
  const note = document.getElementById('stockAdjNote').value.trim();
  if(!itemName){ alert('请输入品名'); return; }
  if(!qtyRaw || qtyRaw<=0 || isNaN(qtyRaw)){ alert('请输入数量（正数就好，类型上面选）'); return; }
  const signedQty = stockAdjType==='out' ? -Math.abs(qtyRaw) : Math.abs(qtyRaw);
  const company = stockAdjCompany;
  mutate(()=>{
    if(!state.stockAdjustments) state.stockAdjustments = [];
    state.stockAdjustments.push({id:uid(), date, itemName, qty:signedQty, note, company});
  });
  ['stockAdjItemText','stockAdjQty','stockAdjNote'].forEach(id=>{ const elx=document.getElementById(id); if(elx) elx.value=''; });
}
function deleteStockAdjustment(id){
  if(!confirm('确定删除这笔出入库调整记录吗？此操作无法撤销。')) return;
  mutate(()=>{ state.stockAdjustments = (state.stockAdjustments||[]).filter(a=>a.id!==id); });
}

/* ---------------- 总渲染 & Tab 切换 ---------------- */
/* 数据量大了以后，每次存档/云同步都把8个分页全部重新画一次很浪费也很卡——
   其实没在看的分页当下画不画都没差，只要"切过去的时候"是新的就好。
   所以改成：header的现金条随时更新，分页内容只画"目前正在看的那一页"，
   切换分页的时候再当场重画一次该页，保证看到的一定是最新的。 */
const TAB_RENDERERS = {
  home: renderHome,
  overview: renderOverview,
  purchase: renderPurchase,
  cost: renderCost,
  sales: renderSales,
  inventory: renderInventory,
  cash: renderCash,
  export: renderExport,
  settings: renderSettings
};
let activeTab = 'home';
/* 统一的切分页逻辑：底部导航按钮、首页"快捷操作"按钮、右上角账号选单（导出/设置）都共用这个，
   不管那个分页在不在底部导航栏上（导出、设置故意不放在底部导航，只能从账号选单进去）都能切换。 */
function switchToTab(tabName){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tabName));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('tab-'+tabName);
  if(panel) panel.classList.add('active');
  activeTab = tabName;
  if(TAB_RENDERERS[activeTab]) TAB_RENDERERS[activeTab]();
}
/* 首页"快捷操作"按钮用：切到指定分页之后，把画面卷到最上面、
   聚焦到那一页第一个要填的输入框，方便直接开始打字记账。 */
const TAB_QUICK_FOCUS = { purchase:'purSupplier', sales:'saleProduct' };
function goToTab(tabName){
  switchToTab(tabName);
  window.scrollTo({top:0, behavior:'smooth'});
  const focusId = TAB_QUICK_FOCUS[tabName];
  if(focusId){
    setTimeout(()=>{ const elx = document.getElementById(focusId); if(elx) elx.focus(); }, 150);
  }
}
/* 首页"记录收入"快捷按钮：切到"收支"页，并且把类型先切成"收入"（不是预设的"支出"），
   再聚焦到第一个收入金额框（Cash），方便直接打字。 */
function quickRecordIncome(){
  cfType = 'in';
  switchToTab('cash');
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(()=>{ const elx = document.getElementById('cfIncome_'+INCOME_CATEGORIES[0]); if(elx) elx.focus(); }, 150);
}
/* 首页"记录支出"快捷按钮：切到"收支"页，并且把类型先切成"支出"，
   再聚焦到金额框，方便直接打字。 */
function quickRecordExpense(){
  cfType = 'out';
  switchToTab('cash');
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(()=>{ const elx = document.getElementById('cfAmount'); if(elx) elx.focus(); }, 150);
}
function renderAll(){
  if(!loaded) return;
  renderCashStrip();
  (TAB_RENDERERS[activeTab] || renderOverview)();
}
document.getElementById('bottomNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  switchToTab(btn.dataset.tab);
});

loadState();
</script>
